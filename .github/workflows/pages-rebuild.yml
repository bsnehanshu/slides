name: Rebuild GitHub Pages

# Pages (deploy from branch: main, /) stopped rebuilding on merges.
# This asks GitHub for a fresh Pages build on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
