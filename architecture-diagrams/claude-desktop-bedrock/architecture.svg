<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 930" role="img" aria-label="Claude Desktop on Amazon Bedrock: MDM pushes managed config, the user signs in to IAM Identity Center federated to the corporate IdP, the app gets short-lived per-user role credentials, and Cowork and Code sessions call Bedrock directly with SigV4; CloudTrail and CUR 2.0 attribute usage to each IAM principal." font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3F4B5B"/>
    </marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B85C38"/>
    </marker>
  </defs>
  <rect width="1400" height="930" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="30" y="38" font-size="22" font-weight="700" fill="#232F3E">Claude Desktop on Amazon Bedrock · 3P reference architecture</text>
  <text x="1370" y="38" font-size="11" fill="#5F6B7A" text-anchor="end">Checked against claude.com/docs/third-party · Oct 2026</text>

  <!-- Federation line IdP <-> IdC (drawn first, under boxes) -->
  <path d="M140,120 V64 H1300 V125" fill="none" stroke="#3F4B5B" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="720" y="58" font-size="11" fill="#3F4B5B" text-anchor="middle">IdC federated to corporate IdP (SAML + SCIM)</text>

  <!-- ============ Corporate column ============ -->
  <rect x="30" y="80" width="220" height="480" rx="6" fill="#F7F8FA" stroke="#8D99A8"/>
  <text x="45" y="102" font-size="13" font-weight="700" fill="#232F3E">Corporate</text>

  <rect x="45" y="120" width="190" height="70" rx="4" fill="#FFFFFF" stroke="#8D99A8"/>
  <text x="140" y="148" font-size="13" font-weight="700" fill="#232F3E" text-anchor="middle">Corporate IdP</text>
  <text x="140" y="167" font-size="11" fill="#5F6B7A" text-anchor="middle">Okta · Entra ID</text>

  <rect x="45" y="230" width="190" height="80" rx="4" fill="#FFFFFF" stroke="#8D99A8"/>
  <text x="140" y="256" font-size="13" font-weight="700" fill="#232F3E" text-anchor="middle">MDM</text>
  <text x="140" y="275" font-size="11" fill="#5F6B7A" text-anchor="middle">Jamf · Intune</text>
  <text x="140" y="292" font-size="10.5" fill="#5F6B7A" text-anchor="middle" font-family="Menlo, Consolas, monospace">.mobileconfig / .reg</text>

  <rect x="45" y="370" width="190" height="80" rx="4" fill="#FFFFFF" stroke="#8D99A8"/>
  <text x="140" y="396" font-size="13" font-weight="700" fill="#232F3E" text-anchor="middle">OTel collector / SIEM</text>
  <text x="140" y="415" font-size="11" fill="#5F6B7A" text-anchor="middle">enduser.id on every record</text>
  <text x="140" y="432" font-size="11" fill="#5F6B7A" text-anchor="middle">independent of AWS</text>

  <!-- ============ Laptop ============ -->
  <rect x="290" y="80" width="640" height="560" rx="8" fill="#F7F8FA" stroke="#232F3E" stroke-width="1.5"/>
  <text x="305" y="103" font-size="13" font-weight="700" fill="#232F3E">User laptop · macOS / Windows</text>
  <text x="522" y="103" font-size="11" fill="#5F6B7A">runs only while awake and the app is open</text>

  <!-- App shell -->
  <rect x="305" y="125" width="250" height="500" rx="6" fill="#FBF1EB" stroke="#B85C38" stroke-width="1.5"/>
  <text x="320" y="147" font-size="13" font-weight="700" fill="#7A3A20">Claude Desktop app (host)</text>

  <g font-size="11" fill="#5F6B7A">
    <rect x="320" y="160" width="220" height="62" rx="4" fill="#FFFFFF" stroke="#B85C38"/>
    <text x="332" y="181" font-size="12.5" font-weight="700" fill="#232F3E">Auth broker</text>
    <text x="332" y="198">IdC tokens in Keychain / DPAPI</text>
    <text x="332" y="213">expiry checked before each turn</text>

    <rect x="320" y="236" width="220" height="62" rx="4" fill="#FFFFFF" stroke="#B85C38"/>
    <text x="332" y="257" font-size="12.5" font-weight="700" fill="#232F3E">Managed config loader</text>
    <text x="332" y="274">plist · HKLM wins over HKCU</text>
    <text x="332" y="289">no merge between them</text>

    <rect x="320" y="312" width="220" height="62" rx="4" fill="#FFFFFF" stroke="#B85C38"/>
    <text x="332" y="333" font-size="12.5" font-weight="700" fill="#232F3E">Connectors · MCP · plugins</text>
    <text x="332" y="350">skills, hooks</text>
    <text x="332" y="365" font-family="Menlo, Consolas, monospace" font-size="10">managedMcpServers</text>

    <rect x="320" y="388" width="220" height="62" rx="4" fill="#FFFFFF" stroke="#B85C38"/>
    <text x="332" y="409" font-size="12.5" font-weight="700" fill="#232F3E">OTel exporter</text>
    <text x="332" y="426">metadata only by default</text>
    <text x="332" y="441" font-family="Menlo, Consolas, monospace" font-size="10">otlpEndpoint, otlpHeaders</text>

    <rect x="320" y="464" width="220" height="62" rx="4" fill="#FFFFFF" stroke="#B85C38"/>
    <text x="332" y="485" font-size="12.5" font-weight="700" fill="#232F3E">Local conversation store</text>
    <text x="332" y="502">on disk: data residency</text>
    <text x="332" y="517" font-family="Menlo, Consolas, monospace" font-size="10">*SessionRetentionDays</text>

    <rect x="320" y="540" width="220" height="62" rx="4" fill="#FFFFFF" stroke="#B85C38"/>
    <text x="332" y="561" font-size="12.5" font-weight="700" fill="#232F3E">Chat tab (opt-in)</text>
    <text x="332" y="578">off by default on 3P</text>
    <text x="332" y="593" font-family="Menlo, Consolas, monospace" font-size="10">chatTabEnabled: true</text>
  </g>

  <!-- Cowork session -->
  <rect x="575" y="125" width="340" height="240" rx="6" fill="#FFFFFF" stroke="#8D99A8"/>
  <text x="590" y="147" font-size="13" font-weight="700" fill="#232F3E">Cowork session</text>
  <rect x="590" y="160" width="310" height="56" rx="4" fill="#FBF1EB" stroke="#B85C38"/>
  <text x="602" y="182" font-size="12.5" font-weight="700" fill="#232F3E">Agent loop · in the app, on host</text>
  <text x="602" y="200" font-size="11" fill="#5F6B7A">calls the model, dispatches tools</text>
  <line x1="745" y1="216" x2="745" y2="230" stroke="#3F4B5B" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="753" y="227" font-size="10" fill="#5F6B7A">shell / code tools</text>
  <rect x="590" y="232" width="310" height="118" rx="4" fill="#EEF1F5" stroke="#3F4B5B" stroke-dasharray="4 3"/>
  <text x="602" y="254" font-size="12.5" font-weight="700" fill="#232F3E">Linux VM</text>
  <text x="602" y="272" font-size="11" fill="#5F6B7A">Virtualization.framework (macOS) · Hyper-V (Win)</text>
  <text x="602" y="290" font-size="11" fill="#5F6B7A">Runs shell commands and code only</text>
  <text x="602" y="308" font-size="11" fill="#5F6B7A">Allowed folders mounted ro / rw</text>
  <text x="602" y="326" font-size="10" fill="#5F6B7A" font-family="Menlo, Consolas, monospace">allowedWorkspaceFolders</text>
  <text x="602" y="341" font-size="10" fill="#5F6B7A" font-family="Menlo, Consolas, monospace">coworkEgressAllowedHosts</text>

  <!-- Code session -->
  <rect x="575" y="385" width="340" height="240" rx="6" fill="#FFFFFF" stroke="#8D99A8"/>
  <text x="590" y="407" font-size="13" font-weight="700" fill="#232F3E">Code tab session</text>
  <rect x="590" y="420" width="310" height="56" rx="4" fill="#FBF1EB" stroke="#B85C38"/>
  <text x="602" y="442" font-size="12.5" font-weight="700" fill="#232F3E">Claude Code engine · host process</text>
  <text x="602" y="460" font-size="11" fill="#5F6B7A">separate managed-settings.json wins unless merge</text>
  <line x1="745" y1="476" x2="745" y2="490" stroke="#3F4B5B" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="590" y="492" width="310" height="118" rx="4" fill="#EEF1F5" stroke="#3F4B5B" stroke-dasharray="4 3"/>
  <text x="602" y="514" font-size="12.5" font-weight="700" fill="#232F3E">OS sandbox · local repo + git</text>
  <text x="602" y="532" font-size="11" fill="#5F6B7A">Seatbelt (macOS) · bubblewrap (Linux)</text>
  <text x="602" y="550" font-size="11" font-weight="700" fill="#B42318">No shell sandbox on Windows</text>
  <text x="602" y="568" font-size="11" fill="#5F6B7A">Network sandbox only if egress allowlist set</text>
  <text x="602" y="586" font-size="11" fill="#5F6B7A">SSH remote sessions via allowlist</text>
  <text x="602" y="601" font-size="10" fill="#5F6B7A" font-family="Menlo, Consolas, monospace">sshHostAllowlist</text>

  <!-- ============ AWS account ============ -->
  <rect x="970" y="80" width="400" height="560" rx="6" fill="#FFFFFF" stroke="#E7157B" stroke-width="1.5"/>
  <text x="985" y="103" font-size="13" font-weight="700" fill="#B0105E">Customer AWS account</text>
  <text x="1355" y="103" font-size="11" fill="#5F6B7A" text-anchor="end">inference, creds and logs stay here</text>

  <rect x="990" y="125" width="360" height="80" rx="4" fill="#FFF4F9" stroke="#E7157B"/>
  <text x="1002" y="148" font-size="13" font-weight="700" fill="#232F3E">IAM Identity Center</text>
  <text x="1002" y="167" font-size="11" fill="#5F6B7A">Permission set → role · session 8–12 h</text>
  <text x="1002" y="184" font-size="11" fill="#5F6B7A">Device-auth sign-in in system browser</text>
  <text x="1002" y="199" font-size="10" fill="#5F6B7A" font-family="Menlo, Consolas, monospace">inferenceBedrockSso{StartUrl,Region,AccountId,RoleName}</text>

  <rect x="990" y="222" width="360" height="50" rx="4" fill="#FFFFFF" stroke="#8D99A8" stroke-dasharray="5 4"/>
  <text x="1002" y="243" font-size="12" font-weight="700" fill="#3F4B5B">Optional: VPC endpoint or LLM gateway</text>
  <text x="1002" y="261" font-size="10" fill="#5F6B7A" font-family="Menlo, Consolas, monospace">inferenceBedrockBaseUrl · provider=gateway</text>

  <rect x="990" y="290" width="360" height="135" rx="4" fill="#E9F7F4" stroke="#01A88D" stroke-width="1.5"/>
  <text x="1002" y="314" font-size="14" font-weight="700" fill="#232F3E">Amazon Bedrock</text>
  <text x="1002" y="334" font-size="11" fill="#3F4B5B" font-family="Menlo, Consolas, monospace">InvokeModelWithResponseStream</text>
  <text x="1002" y="353" font-size="11" fill="#5F6B7A">Inference profiles:</text>
  <text x="1002" y="369" font-size="10.5" fill="#3F4B5B" font-family="Menlo, Consolas, monospace">global. us. eu. apac. jp. au.</text>
  <text x="1002" y="389" font-size="11" fill="#5F6B7A">Application inference profiles + cost tags</text>
  <text x="1002" y="406" font-size="11" fill="#5F6B7A">Model invocation logging (optional)</text>

  <rect x="990" y="455" width="175" height="165" rx="4" fill="#FFFFFF" stroke="#8D99A8"/>
  <text x="1002" y="478" font-size="13" font-weight="700" fill="#232F3E">AWS CloudTrail</text>
  <text x="1002" y="497" font-size="11" fill="#5F6B7A">userIdentity per call:</text>
  <text x="1002" y="516" font-size="10" fill="#3F4B5B" font-family="Menlo, Consolas, monospace">assumed-role/</text>
  <text x="1002" y="531" font-size="10" fill="#3F4B5B" font-family="Menlo, Consolas, monospace">AWSReservedSSO_</text>
  <text x="1002" y="546" font-size="10" fill="#3F4B5B" font-family="Menlo, Consolas, monospace">&lt;PermSet&gt;/&lt;user&gt;</text>
  <text x="1002" y="572" font-size="11" fill="#5F6B7A">Audit: who called</text>
  <text x="1002" y="588" font-size="11" fill="#5F6B7A">which model, when</text>

  <rect x="1175" y="455" width="175" height="165" rx="4" fill="#FFFFFF" stroke="#8D99A8"/>
  <text x="1187" y="478" font-size="13" font-weight="700" fill="#232F3E">CUR 2.0</text>
  <text x="1187" y="497" font-size="11" fill="#5F6B7A">IAM principal cost</text>
  <text x="1187" y="512" font-size="11" fill="#5F6B7A">allocation (Apr 2026)</text>
  <text x="1187" y="531" font-size="10" fill="#3F4B5B" font-family="Menlo, Consolas, monospace">line_item_</text>
  <text x="1187" y="546" font-size="10" fill="#3F4B5B" font-family="Menlo, Consolas, monospace">iam_principal</text>
  <text x="1187" y="572" font-size="11" fill="#5F6B7A">+ principal / session</text>
  <text x="1187" y="588" font-size="11" fill="#5F6B7A">tags as cost tags</text>

  <!-- ============ Flows ============ -->
  <!-- 1 MDM -> config loader -->
  <line x1="235" y1="267" x2="318" y2="267" stroke="#3F4B5B" stroke-width="1.75" marker-end="url(#ah)"/>
  <!-- 2/3 broker <-> IdC -->
  <path d="M500,158 V113 H1170 V123" fill="none" stroke="#3F4B5B" stroke-width="1.75" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <!-- 4 broker -> Cowork loop, broker -> Code engine -->
  <line x1="540" y1="188" x2="588" y2="188" stroke="#B85C38" stroke-width="1.75" marker-end="url(#ahc)"/>
  <path d="M540,206 H565 V448 H588" fill="none" stroke="#B85C38" stroke-width="1.75" marker-end="url(#ahc)"/>
  <!-- 5 sessions -> Bedrock via SigV4 -->
  <path d="M900,188 H950 V448" fill="none" stroke="#01A88D" stroke-width="2"/>
  <line x1="900" y1="448" x2="950" y2="448" stroke="#01A88D" stroke-width="2"/>
  <path d="M950,357 H988" fill="none" stroke="#01A88D" stroke-width="2" marker-end="url(#ah)"/>
  <!-- 6 Bedrock -> CloudTrail / CUR -->
  <line x1="1077" y1="425" x2="1077" y2="453" stroke="#3F4B5B" stroke-width="1.75" marker-end="url(#ah)"/>
  <line x1="1262" y1="425" x2="1262" y2="453" stroke="#3F4B5B" stroke-width="1.75" marker-end="url(#ah)"/>
  <!-- 7 OTel -> collector -->
  <line x1="320" y1="419" x2="237" y2="419" stroke="#3F4B5B" stroke-width="1.75" marker-end="url(#ah)"/>

  <!-- Step badges -->
  <g font-size="12" font-weight="700" text-anchor="middle" fill="#232F3E">
    <circle cx="272" cy="267" r="11" fill="#FF9900"/><text x="272" y="271">1</text>
    <circle cx="800" cy="113" r="10" fill="#FF9900"/><text x="800" y="117">2</text>
    <circle cx="826" cy="113" r="10" fill="#FF9900"/><text x="826" y="117">3</text>
    <circle cx="564" cy="188" r="11" fill="#FF9900"/><text x="564" y="192">4</text>
    <circle cx="565" cy="330" r="11" fill="#FF9900"/><text x="565" y="334">4</text>
    <circle cx="950" cy="300" r="11" fill="#FF9900"/><text x="950" y="304">5</text>
    <circle cx="1077" cy="439" r="11" fill="#FF9900"/><text x="1077" y="443">6</text>
    <circle cx="1262" cy="439" r="11" fill="#FF9900"/><text x="1262" y="443">6</text>
    <circle cx="272" cy="419" r="11" fill="#FF9900"/><text x="272" y="423">7</text>
  </g>

  <!-- ============ Bottom band ============ -->
  <!-- Steps -->
  <rect x="30" y="670" width="560" height="245" rx="6" fill="#F7F8FA" stroke="#8D99A8"/>
  <text x="45" y="694" font-size="13" font-weight="700" fill="#232F3E">Flow</text>
  <g font-size="11.5" fill="#232F3E">
    <circle cx="54" cy="717" r="9" fill="#FF9900"/><text x="54" y="721" text-anchor="middle" font-weight="700" font-size="11">1</text>
    <text x="72" y="721">MDM pushes managed prefs: provider, models, folders, egress, SSO keys</text>
    <circle cx="54" cy="745" r="9" fill="#FF9900"/><text x="54" y="749" text-anchor="middle" font-weight="700" font-size="11">2</text>
    <text x="72" y="749">User signs in to IAM Identity Center (device auth, federated to IdP)</text>
    <circle cx="54" cy="773" r="9" fill="#FF9900"/><text x="54" y="777" text-anchor="middle" font-weight="700" font-size="11">3</text>
    <text x="72" y="777">Per session, app swaps IdC tokens for short-lived role creds (portal.sso)</text>
    <circle cx="54" cy="801" r="9" fill="#FF9900"/><text x="54" y="805" text-anchor="middle" font-weight="700" font-size="11">4</text>
    <text x="72" y="805">Creds written to an owner-only AWS config file; sessions read it via</text>
    <text x="72" y="820" font-family="Menlo, Consolas, monospace" font-size="10.5">AWS_SHARED_CREDENTIALS_FILE + AWS_PROFILE (never env values)</text>
    <circle cx="54" cy="845" r="9" fill="#FF9900"/><text x="54" y="849" text-anchor="middle" font-weight="700" font-size="11">5</text>
    <text x="72" y="849">Cowork loop and Code engine call Bedrock directly, SigV4 over HTTPS</text>
    <circle cx="54" cy="873" r="9" fill="#FF9900"/><text x="54" y="877" text-anchor="middle" font-weight="700" font-size="11">6</text>
    <text x="72" y="877">CloudTrail + CUR 2.0 attribute every call to the user's IAM principal</text>
    <circle cx="54" cy="901" r="9" fill="#FF9900"/><text x="54" y="905" text-anchor="middle" font-weight="700" font-size="11">7</text>
    <text x="72" y="905">Optional OTLP export to your collector, tagged with enduser.id</text>
  </g>

  <!-- Egress -->
  <rect x="610" y="670" width="360" height="245" rx="6" fill="#F7F8FA" stroke="#8D99A8"/>
  <text x="625" y="694" font-size="13" font-weight="700" fill="#232F3E">Laptop egress to allow</text>
  <g font-size="10.5" fill="#3F4B5B" font-family="Menlo, Consolas, monospace">
    <text x="625" y="719">downloads.claude.ai</text>
    <text x="625" y="757">oidc.&lt;region&gt;.amazonaws.com</text>
    <text x="625" y="777">portal.sso.&lt;region&gt;.amazonaws.com</text>
    <text x="625" y="815">bedrock-runtime.&lt;region&gt;.amazonaws.com</text>
  </g>
  <g font-size="11" fill="#5F6B7A">
    <text x="625" y="735">VM bundle + CLI, unless offline installer</text>
    <text x="625" y="831">or the VPC endpoint / gateway instead</text>
    <text x="625" y="865" font-weight="700" fill="#232F3E">Avoid for production</text>
    <text x="625" y="883">Bedrock API key (bearer token): shared,</text>
    <text x="625" y="899">no per-user CloudTrail or CUR identity</text>
  </g>

  <!-- 3P availability -->
  <rect x="990" y="670" width="380" height="245" rx="6" fill="#F7F8FA" stroke="#8D99A8"/>
  <text x="1005" y="694" font-size="13" font-weight="700" fill="#232F3E">On 3P (Bedrock)</text>
  <g font-size="11" fill="#5F6B7A">
    <text x="1005" y="717" font-weight="700" fill="#067647">Available</text>
    <text x="1005" y="734">Cowork, Code tab, Chat (opt-in), MCP, plugins,</text>
    <text x="1005" y="750">skills, scheduled tasks, SSH remote Code,</text>
    <text x="1005" y="766">web search (needs a configured search provider)</text>
    <text x="1005" y="796" font-weight="700" fill="#B42318">Not available</text>
    <text x="1005" y="813">Design, mobile, claude.ai web, voice,</text>
    <text x="1005" y="829">project / plugin sharing, Compliance API,</text>
    <text x="1005" y="845">Analytics API, computer use</text>
    <text x="1005" y="875" font-weight="700" fill="#232F3E">Not applicable</text>
    <text x="1005" y="892">Cloud sessions (run on Anthropic infra)</text>
  </g>
</svg>
