<title>Bedrock Whiteboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: whiteboard deck. Left rail = index of both stories; stage = diagram on a paper card + "what's going on" / "say it like this" notes. */
:root {
  --paper: #f6f6f9; --ink: #1e1e24; --muted: #5d5d6e; --line: #dcdce6;
  --card: #ffffff; --accent: #6965db; --accent-soft: #ecebfd; --say: #fff3bf; --say-ink: #3b3200;
  --code-bg: #eeeef5;
  --f-hand: "Kalam", "Comic Sans MS", cursive;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #18181d; --ink: #ececf2; --muted: #a3a3b6; --line: #2f2f3a;
  --card: #ffffff; --accent: #a8a5ff; --accent-soft: #2a2950; --say: #3a3415; --say-ink: #fff3bf;
  --code-bg: #26262f; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #18181d; --ink: #ececf2; --muted: #a3a3b6; --line: #2f2f3a;
  --card: #ffffff; --accent: #a8a5ff; --accent-soft: #2a2950; --say: #3a3415; --say-ink: #fff3bf;
  --code-bg: #26262f; color-scheme: dark }

html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink); font: 16px/1.5 var(--f-body);
  background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 22px 22px;
}
.app { display: grid; grid-template-columns: 270px minmax(0, 1fr); height: 100%; }

/* rail */
.rail { border-right: 1px solid var(--line); background: var(--paper); overflow-y: auto; padding: 22px 14px 22px 18px; display: flex; flex-direction: column; gap: 18px; }
.brand { font-family: var(--f-hand); font-size: 26px; font-weight: 700; line-height: 1.1; }
.brand small { display: block; font-family: var(--f-body); font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 4px; }
.group h2 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 700; }
.group ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.group button {
  width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 14px;
  padding: 6px 8px; border-radius: 6px; cursor: pointer; display: grid; grid-template-columns: 26px 1fr; gap: 4px; line-height: 1.3;
}
.group button .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-top: 2px; }
.group button:hover { background: var(--accent-soft); }
.group button[aria-current="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 700; box-shadow: inset 3px 0 0 var(--accent); }
.groups { display: flex; flex-direction: column; gap: 18px; }
.keys { margin-top: auto; font-size: 12px; color: var(--muted); }
kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--paper); }

/* stage */
.stage { display: flex; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; }
.head { padding: 22px 32px 10px; display: flex; flex-direction: column; gap: 2px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--f-hand); font-weight: 700; font-size: clamp(28px, 3.2vw, 44px); line-height: 1.1; margin: 0; text-wrap: balance; }
.body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; padding: 8px 32px 12px; }
.board {
  min-width: 0; min-height: 0; background: var(--card); border: 2px solid var(--ink); border-radius: 14px 18px 12px 16px / 16px 12px 18px 14px;
  box-shadow: 4px 5px 0 var(--line); display: flex; align-items: center; justify-content: center; padding: 14px; overflow: auto;
}
.board img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
.notes { min-width: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.notes h3 { font-family: var(--f-hand); font-size: 22px; margin: 0 0 6px; font-weight: 700; }
.notes ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.notes li { position: relative; padding-left: 20px; font-size: 15.5px; }
.notes li::before { content: ""; position: absolute; left: 2px; top: 9px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--accent); }
code { font-family: var(--f-mono); font-size: .86em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.say { background: var(--say); color: var(--say-ink); padding: 14px 16px 16px; border-radius: 3px; transform: rotate(-.6deg); box-shadow: 2px 3px 0 var(--line); }
.say h3 { font-size: 18px; margin-bottom: 4px; }
.say p { margin: 0; font-family: var(--f-hand); font-size: 20px; line-height: 1.35; }

.foot { display: flex; align-items: center; gap: 12px; padding: 8px 32px 18px; }
.foot button {
  font: inherit; font-size: 14px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 8px;
  padding: 6px 14px; cursor: pointer;
}
.foot button:hover:not(:disabled) { background: var(--accent-soft); }
.foot button:disabled { opacity: .35; cursor: default; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; justify-content: center; }
.dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots span.gap { width: 14px; background: transparent; }
.dots span.on { background: var(--accent); }
.count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

@media (max-width: 1100px) { .body { grid-template-columns: minmax(0, 1fr); overflow-y: auto; } .board { min-height: 300px; } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); max-height: none; padding-inline: 16px; }
  .rail .groups { display: none; }
  .rail.open .groups { display: flex; flex-direction: column; gap: 14px; }
  .menu { display: inline-block !important; }
  .keys { display: none; }
  .stage { height: auto; overflow: visible; }
  .head, .body, .foot { padding-inline: 16px; }
  .body { display: flex; flex-direction: column; }
  .board { min-height: 0; }
  .board img { max-height: none; }
}
.menu { display: none; font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; align-self: flex-start; }
@media (prefers-reduced-motion: no-preference) { .board img { animation: in .25s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(4px); } } }
</style>

<div class="app">
  <nav class="rail" id="rail" aria-label="Slides">
    <div class="brand">Bedrock Whiteboard<small>Two stories, drawn in Excalidraw. Come back here when you need the context.</small></div>
    <button class="menu" id="menu" aria-expanded="false" aria-controls="groups">All slides</button>
    <div class="groups" id="groups"></div>
    <div class="keys"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>1</kbd>–<kbd>9</kbd> jump · links like <code>#b3</code> open one slide</div>
  </nav>
  <main class="stage">
    <header class="head"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1></header>
    <section class="body">
      <figure class="board" style="margin:0"><img id="img" alt=""></figure>
      <aside class="notes">
        <div><h3>What's going on</h3><ul id="what"></ul></div>
        <div class="say"><h3>Say it like this</h3><p id="say"></p></div>
      </aside>
    </section>
    <footer class="foot">
      <button id="prev">← Prev</button>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <span class="count" id="count"></span>
      <button id="next">Next →</button>
    </footer>
  </main>
</div>

<script>
const SLIDES = /*SLIDES*/;
const STORIES = { A: "Story A · Claude Desktop on Bedrock", B: "Story B · Claude on Bedrock, under the hood" };
const $ = id => document.getElementById(id);
let cur = 0;

const groups = $("groups");
for (const key of Object.keys(STORIES)) {
  const g = document.createElement("div"); g.className = "group";
  g.innerHTML = `<h2>${STORIES[key]}</h2><ol></ol>`;
  SLIDES.forEach((s, i) => {
    if (s.story !== key) return;
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.dataset.i = i;
    b.innerHTML = `<span class="n">${s.id.toUpperCase()}</span><span>${s.title}</span>`;
    b.addEventListener("click", () => { go(i); $("rail").classList.remove("open"); $("menu").setAttribute("aria-expanded", "false"); });
    li.appendChild(b); g.querySelector("ol").appendChild(li);
  });
  groups.appendChild(g);
}
const dots = $("dots");
SLIDES.forEach((s, i) => {
  if (i && s.story !== SLIDES[i - 1].story) { const gap = document.createElement("span"); gap.className = "gap"; dots.appendChild(gap); }
  const d = document.createElement("span"); d.dataset.i = i; dots.appendChild(d);
});

function go(i, push = true) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  $("eyebrow").textContent = s.eyebrow;
  $("title").textContent = s.title;
  const img = $("img"); img.src = s.src; img.alt = "Excalidraw diagram: " + s.title;
  $("what").innerHTML = s.what.map(w => `<li>${w}</li>`).join("");
  $("say").textContent = s.say;
  $("count").textContent = `${cur + 1} / ${SLIDES.length}`;
  $("prev").disabled = cur === 0; $("next").disabled = cur === SLIDES.length - 1;
  document.querySelectorAll(".group button").forEach(b => b.setAttribute("aria-current", String(+b.dataset.i === cur)));
  document.querySelectorAll(".dots span[data-i]").forEach(d => d.classList.toggle("on", +d.dataset.i === cur));
  if (push) { try { history.replaceState(null, "", "#" + s.id); } catch (e) {} }
}
$("prev").onclick = () => go(cur - 1);
$("next").onclick = () => go(cur + 1);
$("menu").onclick = () => { const r = $("rail"); const open = r.classList.toggle("open"); $("menu").setAttribute("aria-expanded", String(open)); };
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); go(cur + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(cur - 1); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(SLIDES.length - 1);
  else if (/^[1-9]$/.test(e.key)) go(+e.key - 1);
});
let tx = null;
document.querySelector(".board").addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
document.querySelector(".board").addEventListener("touchend", e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1)); tx = null; });
const fromHash = () => { const h = location.hash.slice(1).toLowerCase(); const i = SLIDES.findIndex(s => s.id === h); return i; };
window.addEventListener("hashchange", () => { const i = fromHash(); if (i >= 0 && i !== cur) go(i, false); });
go(Math.max(0, fromHash()), false);
</script>
