<title>/*TITLE*/</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: diagram-first. The Excalidraw board fills the screen; a thin top bar names the slide.
   Slide list (S) and notes (N) are drawers, closed by default. Z toggles fit / actual size. */
:root {
  --paper: #f3f3f7; --ink: #1e1e24; --muted: #5d5d6e; --line: #d9d9e3;
  --chrome: rgba(243,243,247,.92); --board: #ffffff; --accent: #6965db; --accent-soft: #e9e8fd;
  --say: #fff3bf; --say-ink: #3b3200; --code-bg: #ececf3;
  --f-hand: "Kalam", "Comic Sans MS", cursive;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #16161b; --ink: #ececf2; --muted: #a3a3b6; --line: #2e2e39;
  --chrome: rgba(22,22,27,.92); --board: #ffffff; --accent: #a8a5ff; --accent-soft: #2a2950;
  --say: #3a3415; --say-ink: #fff3bf; --code-bg: #26262f; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #16161b; --ink: #ececf2; --muted: #a3a3b6; --line: #2e2e39;
  --chrome: rgba(22,22,27,.92); --board: #ffffff; --accent: #a8a5ff; --accent-soft: #2a2950;
  --say: #3a3415; --say-ink: #fff3bf; --code-bg: #26262f; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-body); overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { display: flex; flex-direction: column; height: 100%; }

/* top bar */
.bar { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--paper); min-width: 0; }
.chip { flex: none; border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.chip:hover, .chip[aria-pressed="true"], .chip[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); }
.chip kbd { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.where { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
.eyebrow { flex: none; font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.title { min-width: 0; font-family: var(--f-hand); font-weight: 700; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count { flex: none; font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* stage */
.stage { flex: 1; min-height: 0; position: relative; display: flex; }
.board { flex: 1; min-width: 0; overflow: auto; display: grid; place-items: center; padding: 16px 64px; }
.board img { display: block; max-width: 100%; max-height: calc(100vh - 90px); width: auto; height: auto; background: var(--board); border-radius: 10px; box-shadow: 0 1px 0 var(--line), 0 10px 30px rgba(0,0,0,.08); cursor: zoom-in; }
.board.actual { place-items: start center; }
.board.actual img { max-width: none; max-height: none; cursor: zoom-out; }
.nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 72px; border: 1px solid var(--line); border-radius: 10px; background: var(--chrome); cursor: pointer; font-size: 22px; opacity: .55; transition: opacity .15s; z-index: 2; }
.nav:hover { opacity: 1; }
.nav:disabled { opacity: 0; pointer-events: none; }
.nav.prev { left: 10px; } .nav.next { right: 10px; }

/* drawers */
.drawer { position: absolute; top: 0; bottom: 0; z-index: 5; background: var(--chrome); backdrop-filter: blur(6px); overflow-y: auto; padding: 16px; }
.drawer[hidden] { display: none !important; }
.slides { left: 0; width: min(300px, 88vw); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; }
.slides h2 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.slides ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.slides li button { width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 6px; cursor: pointer; display: grid; grid-template-columns: 28px 1fr; gap: 4px; line-height: 1.3; font-size: 14px; }
.slides li button .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-top: 1px; }
.slides li button:hover { background: var(--accent-soft); }
.slides li button[aria-current="true"] { background: var(--accent-soft); font-weight: 700; box-shadow: inset 3px 0 0 var(--accent); }
.notes { right: 0; width: min(360px, 92vw); border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; }
.notes h3 { font-family: var(--f-hand); font-size: 20px; margin: 0 0 6px; }
.notes ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.notes li { position: relative; padding-left: 18px; }
.notes li::before { content: ""; position: absolute; left: 1px; top: 8px; width: 7px; height: 7px; border-radius: 50%; border: 2px solid var(--accent); }
code { font-family: var(--f-mono); font-size: .85em; background: var(--code-bg); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
.say { background: var(--say); color: var(--say-ink); padding: 12px 14px 14px; border-radius: 3px; }
.say h3 { font-size: 17px; margin-bottom: 2px; }
.say p { margin: 0; font-family: var(--f-hand); font-size: 19px; line-height: 1.35; }
.help { font-size: 12px; color: var(--muted); }
.help kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

@media (max-width: 700px) {
  .bar { flex-wrap: wrap; padding-inline: 16px; }
  .where { order: 3; flex-basis: 100%; }
  .chip kbd { display: none; }
  .board { padding: 12px 16px; }
  .board img { max-height: none; }
  .nav { display: none; }
}
@media (prefers-reduced-motion: no-preference) { .board img { animation: in .2s ease-out; } @keyframes in { from { opacity: .5; } } }
</style>

<div class="app">
  <header class="bar">
    <button class="chip" id="tSlides" aria-expanded="false" aria-controls="slides">☰ Slides <kbd>S</kbd></button>
    <div class="where"><span class="eyebrow" id="eyebrow"></span><span class="title" id="title"></span></div>
    <span class="count" id="count"></span>
    <button class="chip" id="tZoom" aria-pressed="false" title="Fit to screen / actual size">Zoom <kbd>Z</kbd></button>
    <button class="chip" id="tNotes" aria-expanded="false" aria-controls="notes">Notes <kbd>N</kbd></button>
  </header>
  <main class="stage">
    <button class="nav prev" id="prev" aria-label="Previous slide">‹</button>
    <div class="board" id="board"><img id="img" alt=""></div>
    <button class="nav next" id="next" aria-label="Next slide">›</button>
    <nav class="drawer slides" id="slides" aria-label="All slides" hidden></nav>
    <aside class="drawer notes" id="notes" hidden>
      <div><h3>What's going on</h3><ul id="what"></ul></div>
      <div class="say"><h3>Say it like this</h3><p id="say"></p></div>
      <p class="help"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>S</kbd> slides · <kbd>N</kbd> notes · <kbd>Z</kbd> zoom · links like <code>#/*FIRSTID*/</code> open one slide</p>
    </aside>
  </main>
</div>

<script>
const SLIDES = /*SLIDES*/;
const STORIES = /*STORIES*/;
const $ = id => document.getElementById(id);
let cur = 0;
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

const list = $("slides");
for (const key of Object.keys(STORIES)) {
  const g = document.createElement("div");
  g.innerHTML = `<h2>${STORIES[key]}</h2><ol></ol>`;
  SLIDES.forEach((s, i) => {
    if (s.story !== key) return;
    const li = document.createElement("li"), b = document.createElement("button");
    b.dataset.i = i;
    b.innerHTML = `<span class="n">${s.id.toUpperCase()}</span><span>${s.title}</span>`;
    b.onclick = () => { go(i); drawer("slides", false); };
    li.appendChild(b); g.querySelector("ol").appendChild(li);
  });
  list.appendChild(g);
}

function drawer(name, open) {
  const el = $(name), btn = $(name === "slides" ? "tSlides" : "tNotes");
  if (open === undefined) open = el.hidden;
  el.hidden = !open; btn.setAttribute("aria-expanded", String(open));
  if (name === "notes") store.set("notes", open ? "1" : "0");
}
function zoom(on) {
  const b = $("board"); if (on === undefined) on = !b.classList.contains("actual");
  b.classList.toggle("actual", on); $("tZoom").setAttribute("aria-pressed", String(on));
}

function go(i, push = true) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  $("eyebrow").textContent = s.eyebrow;
  $("title").textContent = s.title;
  const img = $("img"); img.src = s.src; img.alt = "Excalidraw diagram: " + s.title;
  $("what").innerHTML = s.what.map(w => `<li>${w}</li>`).join("");
  $("say").textContent = s.say;
  $("count").textContent = `${cur + 1} / ${SLIDES.length}`;
  $("prev").disabled = cur === 0; $("next").disabled = cur === SLIDES.length - 1;
  list.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", String(+b.dataset.i === cur)));
  zoom(false); $("board").scrollTo(0, 0);
  if (push) { try { history.replaceState(null, "", "#" + s.id); } catch (e) {} }
}

$("prev").onclick = () => go(cur - 1);
$("next").onclick = () => go(cur + 1);
$("tSlides").onclick = () => drawer("slides");
$("tNotes").onclick = () => drawer("notes");
$("tZoom").onclick = () => zoom();
$("img").onclick = () => zoom();
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "arrowright" || k === "pagedown" || k === " ") { e.preventDefault(); go(cur + 1); }
  else if (k === "arrowleft" || k === "pageup") { e.preventDefault(); go(cur - 1); }
  else if (k === "home") go(0);
  else if (k === "end") go(SLIDES.length - 1);
  else if (k === "n") drawer("notes");
  else if (k === "s") drawer("slides");
  else if (k === "z") zoom();
  else if (k === "escape") { drawer("slides", false); drawer("notes", false); zoom(false); }
});
let tx = null;
$("board").addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
$("board").addEventListener("touchend", e => {
  if (tx === null || $("board").classList.contains("actual")) return;
  const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1)); tx = null;
});
const fromHash = () => SLIDES.findIndex(s => s.id === location.hash.slice(1).toLowerCase());
window.addEventListener("hashchange", () => { const i = fromHash(); if (i >= 0 && i !== cur) go(i, false); });
if (store.get("notes") === "1") drawer("notes", true);
go(Math.max(0, fromHash()), false);
</script>
